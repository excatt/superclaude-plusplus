name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: config-doctor + hook contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck + jq
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck jq

      - name: shellcheck (hook scripts, lib, tests; statusline.sh is vendored)
        run: |
          targets=()
          for f in scripts/*.sh scripts/lib/*.sh tests/hooks/run.sh; do
            [[ "$f" == scripts/statusline.sh ]] || targets+=("$f")
          done
          shellcheck -S warning -x "${targets[@]}"

      - name: python syntax
        run: python3 -m py_compile scripts/*.py

      - name: config-doctor
        run: bash scripts/config-doctor.sh

      - name: hook contract tests
        run: bash tests/hooks/run.sh
